<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoneyJar · 桌機與手機預覽</title><link rel="icon" href="./favicon.svg"><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'PingFang TC',sans-serif;background:#080c12;color:#dce6ef}*{box-sizing:border-box}body{margin:0}header{padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;border-bottom:1px solid #2a3947;background:#14212c}h1{font-size:16px;margin:0;font-weight:600}p{font-size:12px;color:#afbecd;margin:7px 0 0}nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}button,a{font:inherit;font-size:14px;border:1px solid #435568;color:#d0dde9;background:#182c3c;padding:10px 13px;border-radius:6px;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#85dfe8;color:#102531;border-color:#bcf8f8}button:focus-visible,a:focus-visible{outline:2px solid #a5fbff;outline-offset:3px}main{padding:24px 20px}.frame-wrap{margin:auto;border:1px solid #405666;overflow:hidden;border-radius:12px;background:#0c0f14;box-shadow:0 15px 60px #0008}iframe{display:block;border:0;transform-origin:top left;background:#0c0f14}.hint{text-align:center;font-size:12px;line-height:1.8;margin-bottom:17px;color:#a1b4c6}@media(max-width:600px){header{padding:15px}main{padding:18px 8px}button,a{font-size:12px;padding:10px}h1{font-size:14px}}
</style></head><body><header><div><h1>MoneyJar · 桌機與手機預覽</h1><p>獨立合成資料 · 不需 Google 登入</p></div><nav aria-label="預覽尺寸"><button type="button" data-width="1440" aria-pressed="true">桌機 1440</button><button type="button" data-width="390" aria-pressed="false">手機 390</button><button type="button" data-width="360" aria-pressed="false">手機 360</button><a href="./#/demo">直接開啟示範 ↗</a></nav></header><main><p class="hint">此預覽使用示範帳本。請到日曆按「新增紀錄」；點日期看當日明細，未選日期時顯示整月流水帳。</p><div class="frame-wrap"><iframe src="./#/demo" title="MoneyJar 可互動示範" allow="" loading="eager"></iframe></div></main><script>
const frame=document.querySelector('iframe'),wrap=document.querySelector('.frame-wrap');let width=1440;
function resize(){const scale=Math.min(1,(document.querySelector('main').clientWidth-24)/width);const height=width===1440?1000:844;frame.style.width=width+'px';frame.style.height=height+'px';frame.style.transform='scale('+scale+')';wrap.style.width=width*scale+'px';wrap.style.height=height*scale+'px'}
document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{width=Number(button.dataset.width);document.querySelectorAll('[data-width]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));resize()}));new ResizeObserver(resize).observe(document.querySelector('main'));resize();
</script></body></html>
